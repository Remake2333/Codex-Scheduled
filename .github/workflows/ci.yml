name: Safe self-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q weibo_daily tests scripts
      - run: python scripts/check_workflows.py
      - run: python scripts/security_check.py
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: python scripts/selftest.py
      - name: Test report artifact (no sessions)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safe-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/tests.txt
          retention-days: 7
