name: Safe self-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, node24
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q weibo_daily tests scripts
      - run: python scripts/check_workflows.py
      - run: python scripts/security_check.py
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: python scripts/selftest.py
      - name: Test report artifact (no sessions)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: safe-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/tests.txt
          retention-days: 7
