name: Weibo daily (disabled until authorized)
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check/dry-run never submit; execute needs all safety switches'
        required: true
        default: dry-run
        type: choice
        options: [check, dry-run, execute]
concurrency:
  group: weibo-account-single-writer
  cancel-in-progress: false
permissions: {}
jobs:
  daily:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.WEIBO_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: weibo
    permissions:
      contents: write
      issues: write
    env:
      WEIBO_ACCOUNT_ID: ${{ vars.WEIBO_ACCOUNT_ID }}
      WEIBO_AUTOMATION_ENABLED: ${{ vars.WEIBO_AUTOMATION_ENABLED }}
      WEIBO_ALLOW_LIVE: ${{ vars.WEIBO_ALLOW_LIVE }}
      WEIBO_SESSION_KEY: ${{ secrets.WEIBO_SESSION_KEY }}
      WEIBO_SESSION_ENCRYPTED: ${{ secrets.WEIBO_SESSION_ENCRYPTED }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'execute' || inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run requested mode
        shell: bash
        run: |
          args=(run --mode "$REQUESTED_MODE" --output out --max-seconds 1800)
          if [[ "$REQUESTED_MODE" == "execute" ]]; then
            args+=(--confirm-live --notify)
          fi
          python -m weibo_daily "${args[@]}"
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f out/report.md ]]; then
            cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Credential-free execution artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/report.md
            out/state.json
          retention-days: 7
          if-no-files-found: warn
