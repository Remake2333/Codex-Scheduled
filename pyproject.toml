[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-daily"
version = "0.1.0"
description = "Conservative, auditable Weibo super-topic automation"
requires-python = ">=3.12"
dependencies = ["playwright==1.62.0", "cryptography==50.0.0"]

[project.scripts]
weibo-daily = "weibo_daily.__main__:main"

[tool.setuptools.packages.find]
include = ["weibo_daily*"]
